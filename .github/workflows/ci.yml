# Type-checks, tests and builds every push to main and every pull request. `check` is a required status check.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Consumers install this package from git, so the committed dist/ must match the source.
      - name: dist/ is up to date
        run: git diff --exit-code -- dist
